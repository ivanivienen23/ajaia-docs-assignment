<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"></head><style>
:root{font-family:Arial,"Helvetica Neue",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}h1{font-size:20px;margin:0;color:#182238;font-weight:750;letter-spacing:-.02em}.top{height:72px;background:#fff;border-bottom:1px solid #e4e8f0;display:flex;align-items:center;gap:12px;padding:12px 28px;position:sticky;top:0;z-index:2}button,select,input{font:inherit;border:1px solid #dfe3ec;border-radius:999px;padding:8px 12px;background:#fff;outline:0}button{border:1px solid #dfe3ec;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;transition:.15s ease;box-shadow:0 1px 2px #1720330a}button:hover{border-color:#8296e8;background:#f2f5ff;transform:translateY(-1px)}#newBtn,#saveBtn{background:#3157d5;color:#fff;border-color:#3157d5}.presence{margin-left:auto;font-size:12px;color:#68738a}.presence:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;box-shadow:0 0 0 3px #dcfce7}#file{display:none}.file-label{display:inline-flex;align-items:center;cursor:pointer;border:1px solid #dfe3ec;border-radius:999px;padding:9px 14px;background:#fff;box-shadow:0 1px 2px #1720330a;transition:.15s ease}.file-label:hover{border-color:#8296e8;background:#f2f5ff;transform:translateY(-1px)}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#fff;color:#172033;border:1px solid #e5e9f2;border-radius:18px;margin:22px 0 22px 22px;padding:22px 14px;box-shadow:0 10px 30px #253b6712;height:calc(100vh - 112px);position:sticky;top:90px}.aside-title{font-size:11px;letter-spacing:.12em;color:#8b95a8;margin:20px 0 8px}.doc{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:5px 0;background:transparent;color:#354052;border-color:transparent;box-shadow:none;padding:11px 12px;white-space:nowrap;overflow:hidden}.doc-title{overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;font-weight:700;letter-spacing:.04em;color:#5270b8;background:#edf2ff;border-radius:999px;padding:4px 7px;flex:none}.doc:hover{background:#eef2ff;color:#3157d5;border-color:#dbe3ff}.main{max-width:920px;width:calc(100% - 48px);margin:42px auto}.title{font-size:30px;border:0;border-bottom:1px solid #dfe3ec;background:transparent;border-radius:0;outline:0;width:100%;padding:0 0 10px;font-weight:650}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid #e1e5ed;border-radius:10px;padding:8px;margin:12px 0}.editor{background:#fff;min-height:430px;border:1px solid #e1e5ed;border-radius:12px;padding:34px;box-shadow:0 12px 35px #24365d12;line-height:1.7;outline:0}.comments{margin-top:18px;background:#fff;border:1px solid #e1e5ed;border-radius:12px;padding:18px}.comment{border-bottom:1px solid #edf0f5;padding:10px 0}.muted{color:#7b8496;font-size:12px}@media(max-width:700px){.top{padding:12px 14px;height:auto;flex-wrap:wrap}.top h1{width:100%}.presence{margin-left:0}.shell{display:block}.shell aside{border-radius:0;margin:0;border:0;border-bottom:1px solid #e4e8f0;padding:12px 14px;height:auto;position:static;min-height:0}.main{width:calc(100% - 24px);margin:18px auto}.editor{padding:18px;min-height:360px}.title{font-size:23px}#file{max-width:100%}}
</style><body><div class="top"><h1>✦ Ajaia Docs</h1><span id="presence" class="presence">Conectados: comprobando…</span><label>Usuario: <select id="user"><option value="ivan">Ivan</option><option value="grace">Grace</option></select></label><button id="newBtn" type="button">New document</button></div><div class="shell"><aside><div class="aside-title">DOCUMENTOS</div><div id="list"></div></aside><main class="main" id="main">Selecciona o crea un documento</main></div><script>const list=document.getElementById("list"), main=document.getElementById("main"), status=document.createElement("span");document.body.prepend(status); let docs=[]; let current=null; let user=new URLSearchParams(location.search).get("user")||"ivan";document.getElementById("user").value=user;main.insertAdjacentHTML("afterbegin","<div class=actions></div>");const actions=main.querySelector(".actions");actions.append(document.createTextNode("Acciones: "));const saveBtn=document.createElement("button");saveBtn.id="saveBtn";saveBtn.textContent="Guardar";const exportBtn=document.createElement("button");exportBtn.id="exportBtn";exportBtn.textContent="Exportar MD";const file=document.createElement("input");file.id="file";file.type="file";file.accept=".txt,.md";const fl=document.createElement("label");fl.className="file-label";fl.textContent="Importar archivo";fl.append(file);actions.append(saveBtn,exportBtn,fl); async function presence(){const x=await fetch("/api/presence").then(r=>r.json());document.getElementById("presence").textContent="Online: "+x.online.join(", ")}presence();setInterval(()=>{presence();fetch("/api/presence",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:user})})},10000);async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()} function render(){list.innerHTML="";docs.forEach(d=>{const b=document.createElement("button");b.innerHTML="<span class=doc-title>"+d.title+"</span><span class=badge>"+(d.access==="Shared"?"SHARED":"OWNED")+"</span>";b.onclick=()=>show(d);list.appendChild(b)})} function show(d){current=d;main.innerHTML="";main.append(actions);const title=document.createElement("input");title.value=d.title;title.oninput=()=>{d.title=title.value;save()};const tools=document.createElement("div");[["bold","N"],["italic","I"],["underline","U"],["insertUnorderedList","•"],["insertOrderedList","1."]].forEach(item=>{const b=document.createElement("button");b.textContent=item[1];b.title=item[0];b.style.fontWeight=item[0]==="bold"?"700":"400";b.style.fontStyle=item[0]==="italic"?"italic":"normal";b.onclick=()=>{document.execCommand(item[0]);editor.focus()};tools.appendChild(b)});const editor=document.createElement("div");editor.contentEditable=(d.access!=="Shared");editor.style="min-height:300px;border:1px solid #999;padding:20px;margin-top:10px";editor.innerHTML=d.content;editor.oninput=()=>{d.content=editor.innerHTML;save()};const share=document.createElement("button");share.textContent="Compartir con Grace (viewer)";share.onclick=async()=>{await api("/api/share",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({document:d.id,user:"grace",role:"viewer"})});status.textContent="Compartido con Grace"};const comment=document.createElement("button");comment.textContent="Añadir comentario";comment.onclick=async()=>{const text=prompt("Comentario:");if(text)await api("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({document:d.id,user:user,text:text})})};const history=document.createElement("button");history.textContent="Historial";history.onclick=async()=>{const v=await api("/api/versions?document="+d.id);alert("Versiones guardadas: "+v.length)};main.append(title,share,comment,history,tools,editor);const comments=document.createElement("section");comments.className="comments";comments.innerHTML="<b>Comentarios</b><div class=muted>Cargando…</div>";main.append(comments);api("/api/comments?document="+d.id).then(xs=>{comments.innerHTML="<b>Comentarios</b>"+(xs.length?xs.map(x=>"<div class=comment><b>"+x.user+"</b><br>"+x.text+"</div>").join(""):"<div class=muted style=margin-top:10px>Aún no hay comentarios.</div>")})} async function save(){if(!current)return;clearTimeout(window.timer);window.timer=setTimeout(()=>api("/api/documents/"+current.id,{method:"PUT",headers:{"Content-Type":"application/json","X-User":user},body:JSON.stringify({title:current.title,content:current.content})}),300)} document.getElementById("user").onchange=()=>{user=document.getElementById("user").value;location.href="/?user="+user};saveBtn.addEventListener("click",()=>save());exportBtn.addEventListener("click",()=>{if(!current)return;const text=current.content.replace(/<br\s*\/?><\/?p>/gi,"\n").replace(/<\/?p>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/markdown"}));a.download=(current.title||"document")+".md";a.click();URL.revokeObjectURL(a.href)});file.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;const d=await api("/api/documents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:f.name,content:"<p>"+(await f.text()).replaceAll("\n","</p><p>")+"</p>"})});docs.push(d);render();show(d)});document.getElementById("newBtn").addEventListener("click",async function(){try{const d=await api("/api/documents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:"Untitled document",content:"<p>Escribe aquí…</p>"})});docs.push(d);render();show(d)}catch(e){alert("Error al crear: "+e.message)}});(async()=>{const x=await api("/api/documents?user="+user);docs=x.documents;render()})().catch(e=>alert(e.message));</script></body></html>
